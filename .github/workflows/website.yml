name: Website

# Builds the project page whenever it changes, so a broken page fails the pull
# request. Deploys to GitHub Pages from main only once publishing is switched
# on with the repository variable PUBLISH_WEBSITE=true (see website/README.md).
# Until then the deploy job is skipped, not failed.

on:
  pull_request:
    paths: ['website/**', 'code/results/paper/ladder/**', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['website/**', 'code/results/paper/ladder/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      # The constraint ladder's data is generated from the planner's Fig. 2 runs;
      # fail if code/results/paper/ladder changed without re-running the export.
      - name: Check the ladder data matches the planner's runs
        run: python3 scripts/export_ladder.py && git diff --exit-code -- src/data/constraint-ladder.json

      # Type-checks pages and components.
      - run: npm run check

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_WEBSITE == 'true'
        with:
          path: website/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_WEBSITE == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
